<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة ليالي الباب</title><link rel="stylesheet" href="style.css"><style>body{font-family:Arial,sans-serif;background:#f4f6f8}.admin-shell{max-width:1100px;margin:28px auto;padding:16px}.panel{background:white;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 4px 18px #0001}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}input,select,textarea{padding:10px;border:1px solid #ccd2d8;border-radius:8px;width:100%;box-sizing:border-box}.menu-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:12px 0;border-bottom:1px solid #eee}.menu-row img{width:70px;height:60px;object-fit:cover;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,.secondary-btn{border:0;border-radius:8px;padding:10px 16px;cursor:pointer}.save-btn{background:#147d50;color:#fff}.add-btn{background:#175cd3;color:white}.delete-btn{background:#b42318;color:white}.hidden{display:none}.hint{color:#667085;font-size:13px}.notice{padding:10px;background:#fff4ce;border-radius:8px;margin-bottom:12px}</style></head><body><div class="admin-shell"><header class="panel"><h1>لوحة إدارة مطعم ليالي الباب</h1><p>إدارة المنتجات والإعدادات محفوظة في قاعدة البيانات.</p></header><section id="loginPanel" class="panel"><h2>تسجيل دخول الإدارة</h2><div class="form-grid"><label class="field">اسم المستخدم<input id="loginUsername" autocomplete="username" value="layaliadmin"></label><label class="field">كلمة المرور<input id="loginPassword" type="password" autocomplete="current-password"></label></div><button id="loginBtn" class="save-btn">دخول</button><p class="hint">بيانات الدخول تضبط من متغيرات البيئة في Render.</p><p id="loginError"></p></section><div id="dashboard" class="hidden"><section class="panel"><h2>بيانات المطعم</h2><div class="form-grid"><label class="field">اسم المطعم<input id="restaurantName"></label><label class="field">رقم واتساب<input id="phoneInput" type="tel"></label><label class="field">المدينة<input id="cityInput"></label><label class="field">العنوان الصحيح<input id="addressInput"></label><label class="field">بحث الخريطة<input id="mapInput"></label><label class="field">العملة<select id="currencyInput"><option value="TRY">الليرة التركية (₺)</option><option value="SYP">الليرة السورية (ل.س)</option></select></label><label class="field">رسوم التوصيل<input id="deliveryFeeInput" type="number" min="0"></label></div><button id="saveSettingsBtn" class="save-btn">حفظ الإعدادات</button><p id="settingsMessage"></p></section><section class="panel"><h2>إدارة المنتجات</h2><p class="hint">يمكنك إدخال رابط صورة أو اختيار صورة من جهازك. الصور المرفوعة تُحفظ ضمن قاعدة البيانات.</p><div class="actions"><button id="addItemBtn" class="add-btn">إضافة منتج</button><button id="saveMenuBtn" class="save-btn">حفظ التعديلات</button><button id="logoutBtn">تسجيل الخروج</button></div><div id="menuEditor"></div></section><section class="panel"><h2>الطلبات</h2><button id="refreshOrdersBtn">تحديث الطلبات</button><div id="ordersList"></div></section></div></div><script src="admin.js"></script></body></html>
